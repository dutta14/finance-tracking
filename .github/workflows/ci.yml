# NOTE: GitHub Pages must be configured to deploy from "GitHub Actions"
# (Settings → Pages → Source → GitHub Actions), not from a branch.

name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Security audit (npm)
        run: |
          # Excluded advisories (React Router SSR/RSC — not applicable to this client-side SPA):
          # GHSA-qwww-vcr4-c8h2: RSC CSRF bypass
          # GHSA-h8fp-f39c-q6mh: RSCErrorHandler XSS
          # GHSA-337j-9hxr-rhxg: SSR hydration constructor injection
          npm audit --audit-level=high 2>&1 | tee audit.txt || true
          REMAINING=$(grep -oE 'GHSA-[a-z0-9]{4}-[a-z0-9]{4}-[a-z0-9]{4}' audit.txt | sort -u | grep -v -E 'GHSA-qwww-vcr4-c8h2|GHSA-h8fp-f39c-q6mh|GHSA-337j-9hxr-rhxg' || true)
          if [ -n "$REMAINING" ]; then
            echo "::error::Unexcluded high-severity advisories: $REMAINING"
            exit 1
          fi
      - run: npx prettier --check 'src/**/*.{ts,tsx,css}'
      - run: npx eslint src/ --max-warnings=0
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
